services:
  market-simulation-server:
    image: market-simulation-server:latest
    container_name: market-simulation-server-standalone
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "0:3001"
    environment:
      MARKET_PORT: ${MARKET_PORT:-3001}
      MARKET_STATE_FILE: ${MARKET_STATE_FILE:-/app/data/market-state.json}
      MARKET_DATA_DIR: ${MARKET_DATA_DIR:-/app/data}
      MARKET_LOG_DIRECTORY: ${MARKET_LOG_DIRECTORY:-/app/data/logs}
      MARKET_ADMIN_TOKEN: ${MARKET_ADMIN_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      MARKET_SYNC_ROLE: ${MARKET_SYNC_ROLE:-standalone}
      MARKET_SYNC_MASTER_URL: ${MARKET_SYNC_MASTER_URL:-}
      MARKET_SYNC_TOKEN: ${MARKET_SYNC_TOKEN:-}
      MARKET_NODE_ID: ${MARKET_NODE_ID:-}
      MARKET_NODE_SYNC_MODE: ${MARKET_NODE_SYNC_MODE:-bidirectional}
      MARKET_SYNC_INTERVAL_SECONDS: ${MARKET_SYNC_INTERVAL_SECONDS:-5}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 256M