services:
  node-1:
    image: market-simulation-server:latest
    container_name: market-simulation-server-node-1
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "0:3001"
    environment:
      MARKET_PORT: ${MARKET_PORT:-3001}
      MARKET_STATE_FILE: /app/data/market-state.json
      MARKET_DATA_DIR: /app/data
      MARKET_LOG_DIRECTORY: /app/data/logs
      TRUST_PROXY: ${TRUST_PROXY:-}
      MARKET_SYNC_ROLE: node
      MARKET_SYNC_MASTER_URL: ${MARKET_SYNC_MASTER_URL:?Defina MARKET_SYNC_MASTER_URL para iniciar os nodes}
      MARKET_SYNC_TOKEN: ${MARKET_SYNC_TOKEN:?Defina MARKET_SYNC_TOKEN para iniciar os nodes}
      MARKET_NODE_ID: node-1
      MARKET_NODE_PUBLIC_URL: ${MARKET_NODE_PUBLIC_URL_NODE_1:-}
      MARKET_NODE_SYNC_MODE: ${MARKET_NODE_SYNC_MODE_NODE_1:-bidirectional}
      MARKET_SYNC_INTERVAL_SECONDS: ${MARKET_SYNC_INTERVAL_SECONDS:-5}
    volumes:
      - node-1-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 256M

  node-2:
    image: market-simulation-server:latest
    container_name: market-simulation-server-node-backup-2
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "0:3001"
    environment:
      MARKET_PORT: ${MARKET_PORT:-3001}
      MARKET_STATE_FILE: /app/data/market-state.json
      MARKET_DATA_DIR: /app/data
      MARKET_LOG_DIRECTORY: /app/data/logs
      TRUST_PROXY: ${TRUST_PROXY:-}
      MARKET_SYNC_ROLE: node
      MARKET_SYNC_MASTER_URL: ${MARKET_SYNC_MASTER_URL:?Defina MARKET_SYNC_MASTER_URL para iniciar os nodes}
      MARKET_SYNC_TOKEN: ${MARKET_SYNC_TOKEN:?Defina MARKET_SYNC_TOKEN para iniciar os nodes}
      MARKET_NODE_ID: node-2
      MARKET_NODE_PUBLIC_URL: ${MARKET_NODE_PUBLIC_URL_NODE_2:-}
      MARKET_NODE_SYNC_MODE: ${MARKET_NODE_SYNC_MODE_NODE_2:-receive-only}
      # a cada 60 segundos ele puxa o banco, pode ser usado para testes ou backup local de 60s, mantendo assim a consistencia do mercado master, sem enviar dados de teste.
      MARKET_SYNC_INTERVAL_SECONDS: ${MARKET_SYNC_INTERVAL_SECONDS:-60}
    volumes:
      - node-2-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 256M

volumes:
  node-1-data:
  node-2-data:
